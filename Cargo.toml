[package]
name = "couchbox"
version = "0.1.0"
description = "CouchBox — Turn your old laptop into a Smart TV controlled from your phone"
authors = ["m4jorskyy"]
edition = "2021"

[lib]
name = "couchbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
rust-embed = "8"
mime_guess = "2"
local-ip-address = "0.6"
rand = "0.8"
dirs = "5"
enigo = "0.3"
