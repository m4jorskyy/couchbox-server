name: Build CouchBox (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout couchbox-server
        uses: actions/checkout@v4
        with:
          path: RustroverProjects/couchbox-server

      - name: Checkout couchbox-web
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/couchbox-web
          path: WebstormProjects/couchbox-web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install & build frontend
        working-directory: WebstormProjects/couchbox-web
        run: |
          npm run install:all
          npm run build

      - name: Install Tauri CLI & build Windows installer
        working-directory: RustroverProjects/couchbox-server
        run: |
          npm install
          npx tauri build --config tauri.conf.json

      - name: Upload Windows installer & binary
        uses: actions/upload-artifact@v4
        with:
          name: couchbox-windows
          path: |
            RustroverProjects/couchbox-server/target/release/couchbox.exe
            RustroverProjects/couchbox-server/target/release/bundle/nsis/*.exe
            RustroverProjects/couchbox-server/target/release/bundle/msi/*.msi
